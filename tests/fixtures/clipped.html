<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clipped overflow fixture</title>
<link rel="icon" href="data:,">
<style>
  body { margin: 0; overflow-x: hidden; font: 18px/1.5 system-ui, sans-serif; color: #1a1a1a; background: #fff; }
  main { padding: 2rem; }
  /* Decoration wider than a phone, clipped by the page: a visitor never scrolls to it. */
  .shape { width: 900px; height: 40px; background: #ddd; }
  .line { white-space: nowrap; }
</style>
</head>
<body>
<main>
  <h1>Clipped decoration</h1>
  <div class="shape"></div>
  <p>Wrapped text stays inside the screen.</p>
  <p class="line" data-cut>This sentence never wraps, so on a phone its end is cut off at the right edge.</p>
</main>
<script>
  // ?decoration-only removes the cut-off sentence.
  if (location.search.includes('decoration-only')) document.querySelector('[data-cut]').remove();
</script>
</body>
</html>
