name: Idea
description: A feature or an improvement, even a rough one.
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What
      description: The idea in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The problem it solves, or what it brings.
